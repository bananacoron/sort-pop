*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{background:#fff;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;color:#000;touch-action:none}#app{max-width:520px;margin:auto;height:100dvh;display:flex;flex-direction:column;border-inline:3px solid #000;background:#fff}header{padding:calc(env(safe-area-inset-top) + 8px) 12px 5px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #000;font-weight:900}header strong{font-size:23px}.small{font-size:11px}.top{display:flex;justify-content:space-around;align-items:center;padding:7px 8px;gap:8px}.goal{flex:1;text-align:center;border:3px solid #000;border-radius:8px;padding:5px 3px;font-weight:900;font-size:12px}.goal:first-child{background:#ff80c0}.goal:last-child{background:#00ffff}.worker{display:flex;gap:9px;align-items:center;padding:4px 10px;border-block:3px solid #000;min-height:50px;font-size:12px;font-weight:900}.worker svg{width:38px;height:38px}.worker .bar{height:9px;border:2px solid #000;background:#fff;width:100%;margin-top:4px}.fill{height:100%;width:0;background:#ff0000}.workcopy{flex:1}#stage{flex:1;min-height:100px;position:relative;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.footer{border-top:3px solid #000;padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;align-items:center;justify-content:space-between;gap:7px;font-size:12px;font-weight:900}.btn{background:#ffff00;border:3px solid #000;padding:8px 11px;border-radius:7px;font-weight:900}.overlay{position:absolute;inset:0;background:#fff;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;gap:14px}.overlay h1{font-size:clamp(43px,13vw,72px);letter-spacing:-5px;margin:0;line-height:1}.overlay h1 span{color:#ff0080}.overlay p{font-size:14px;line-height:1.9;margin:0;font-weight:750}.overlay button{font-size:21px;padding:14px 24px}.hidden{display:none}.guide{font-size:11px;font-weight:900;background:#ffff00;border:2px solid #000;padding:4px;text-align:center}.mode{border:2px solid #000;padding:7px 12px;background:#fff;font-weight:900;border-radius:7px}.mode.selected{background:#00ffff}.modegroup{display:flex;gap:7px}#notice{font-size:12px;min-width:92px;text-align:right}
</style></head><body><div id="app"><header><div><div class="small">SCORE</div><strong id="score">0</strong></div><div style="text-align:center"><div class="small" id="modeLabel">STACK MODE</div><strong id="time">∞</strong></div><div style="text-align:right"><div class="small">BEST</div><strong id="best">0</strong></div></header><div class="top"><div class="goal" id="goalL">♥ HEART ←</div><div class="goal" id="goalR">→ CLOUD ☁</div></div><div class="worker"><div id="workerFace"></div><div class="workcopy"><div id="workerText">スタッフ待機中</div><div class="bar"><div class="fill" id="fill"></div></div></div><span id="percent">0%</span></div><div class="guide">落下する画面を左右へスワイプ！ 左右の端を上下する的に当てるとBONUS 🎯</div><div id="stage"><canvas id="game"></canvas><div class="overlay" id="overlay"><div class="small">RETRO SORTING ARCADE</div><h1>SORT<span>!</span><br>POP</h1><p>落ちてくるアイテムを左右へ仕分けよう！<br>小間使いは端を上下、反対側へ歩いて移動！<br>的に当てると PERFECT ⭐<br>🐨速いけど片付け上手／👨ゆっくりだけど片付けも遅い<br>形の違うアイテムが転がって積み上がる。<br>フィーバーでスタッフが片付けに来るよ！</p><div class="modegroup"><button class="mode selected" data-mode="endless">∞ ENDLESS</button><button class="mode" data-mode="quick">60秒 QUICK</button></div><div class="modegroup"><button class="mode selected" data-level="easy">EASY</button><button class="mode" data-level="normal">NORMAL</button><button class="mode" data-level="hard">HARD</button></div><button class="btn" id="play">あそぶ！ ▶</button><div class="small">※ 物理挙動は試作版。ゲーム内課金なし</div></div></div><div class="footer"><div id="lives">♥ ♥ ♥</div><div id="combo">COMBO ×0</div><div id="notice">READY!</div><button class="btn" id="restart">↻</button></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),stage=$('stage');
const TYPES=[{id:'heart',color:'#ff0080',r:19},{id:'cloud',color:'#00bfff',r:24},{id:'star',color:'#ffff00',r:23},{id:'circle',color:'#ff0000',r:20},{id:'bar',color:'#00aa00',r:25},{id:'flower',color:'#ff80c0',r:23}];
const PAIRS=[[0,1],[2,3],[4,5]];let difficulty='normal',routeSide=0,routePhase=0,routeClock=0,routeFrom=0,routeTo=1,routeWiggle=0,successes=[],paradeTimer=null;let mode='endless',running=false,score=0,best=0,lives=3,combo=0,fever=0,busy=0,worker='',carrier='koala',time=60,elapsed=0,spawnDelay=0,pair=0,correct=0,active=null,shots=[],bits=[],aim=null,last=0,w=320,h=400,raf=0,noticeTimer=0,helperX=0,helperY=0,helperDir=1,feverIds=new Set(),nextId=1,feverPending=false;
try{best=Number(localStorage.getItem('sortpop_stack_best')||0)}catch(e){}
function staffSvg(k){let ko=k==='koala';return `<svg viewBox="0 0 64 64"><path d="M5 62L9 38L23 32H42L55 40L61 62Z" fill="${ko?'#ff0000':'#00aa00'}" stroke="#000" stroke-width="3"/><path d="${ko?'M7 18Q-2 2 17 6Q33 -3 47 6Q65 1 58 21Q65 44 35 45Q5 47 7 18Z':'M12 20L9 7L23 2L48 4L57 14L51 29L50 43L14 43Z'}" fill="${ko?'#808080':'#ffcc99'}" stroke="#000" stroke-width="3"/><path d="${ko?'M30 22Q23 35 32 37Q41 35 34 22Z':'M10 17L12 4L28 1L50 3L58 17L44 13L25 15Z'}" fill="${ko?'#404040':'#000000'}"/><circle cx="21" cy="24" r="2.5"/><circle cx="43" cy="24" r="2.5"/><path d="M25 37Q33 43 42 36" stroke="#000" stroke-width="2" fill="none"/></svg>`}
function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;canvas.width=Math.round(w*devicePixelRatio);canvas.height=Math.round(h*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
function bins(){return [{x:7,width:w/2-13},{x:w/2+6,width:w/2-13}]}function floor(){return h-9}function rim(){return Math.max(88,h*.38)}
function currentTypes(){return PAIRS[pair%PAIRS.length]}
function hud(){$('score').textContent=score;$('best').textContent=best;$('time').textContent=mode==='quick'?Math.ceil(Math.max(0,time)):'∞';$('lives').textContent='♥ '.repeat(Math.max(0,lives))+'♡ '.repeat(3-lives);$('combo').textContent='COMBO ×'+combo;$('fill').style.width=fever+'%';$('percent').textContent=Math.floor(fever)+'%';$('goalL').textContent='← '+TYPES[currentTypes()[0]].id.toUpperCase();$('goalR').textContent=TYPES[currentTypes()[1]].id.toUpperCase()+' →';$('modeLabel').textContent=mode==='quick'?'QUICK MODE':'STACK MODE'}
function note(s){$('notice').textContent=s;noticeTimer=1.5}
function start(){running=true;score=0;lives=3;combo=0;fever=0;busy=0;worker='';helperX=35;helperY=rim()-65;helperDir=1;routeSide=0;routePhase=0;routeClock=0;routeWiggle=0;successes=[];if(paradeTimer){clearInterval(paradeTimer);paradeTimer=null;}feverIds=new Set();nextId=1;feverPending=false;carrier=Math.random()<.6?'koala':'brother';time=60;elapsed=0;spawnDelay=.25;pair=0;correct=0;active=null;shots=[];bits=[];aim=null;last=performance.now();$('overlay').classList.add('hidden');$('workerFace').innerHTML=staffSvg(carrier);$('workerText').textContent=carrier==='koala'?'🐨 コアラ人間：すばやく運ぶ！':'👨 お兄さん：ゆっくり運ぶ';hud();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function spawn(){if(active||!running)return;let t=currentTypes()[Math.random()<.5?0:1];active={type:t,x:w/2,y:-25,r:TYPES[t].r,age:0,phase:0};spawnDelay=0}
function feverStart(){if(busy||!running)return;worker=carrier;busy=worker==='koala'?.85:2.6;feverIds=new Set(bits.map(p=>p.id));feverPending=true;$('workerFace').innerHTML=staffSvg(worker);$('workerText').textContent=worker==='koala'?'🐨 コアラ人間：さっと片付け！':'👨 お兄さん：のんびり片付け中';note('FEVER! 仕分け続行!')}
function feverFinish(){bits=bits.filter(p=>!feverIds.has(p.id));feverIds.clear();fever=0;busy=0;feverPending=false;score+=300;note('CLEAN +300');carrier=Math.random()<.6?'koala':'brother';$('workerFace').innerHTML=staffSvg(carrier);$('workerText').textContent=carrier==='koala'?'🐨 コアラ人間：的が速い！':'👨 お兄さん：的がゆっくり';}
function helper(){return {x:helperX,y:helperY,r:17,side:routePhase===0?routeSide:-1}}
function moveHelper(dt){
 const fast=carrier==='koala',factor=difficulty==='easy'?.7:difficulty==='hard'?1.45:1;
 const speed=(fast?92:43)*factor;
 if(routePhase===0){
   routeClock+=dt;
   helperX=routeSide===0?34:w-34;
   const low=rim()-36,high=Math.max(62,rim()-135);
   helperY+=helperDir*speed*dt;
   if(helperY>low){helperY=low;helperDir=-1}
   if(helperY<high){helperY=high;helperDir=1}
   if(routeClock>(difficulty==='easy'?4.7:difficulty==='hard'?2.5:3.5)/(fast?1.1:1)){
     routePhase=1;routeClock=0;routeFrom=routeSide;routeTo=1-routeSide;routeWiggle=Math.random()*6;
   }
 }else{
   routeClock+=dt;
   const duration=(fast?1.25:2.6)*(difficulty==='easy'?1.3:difficulty==='hard'?.8:1);
   let t=Math.min(1,routeClock/duration);
   const ease=t*t*(3-2*t);
   helperX=(routeFrom===0?34:w-34)+((routeTo===0?34:w-34)-(routeFrom===0?34:w-34))*ease;
   const baseline=Math.max(72,rim()-75);
   helperY=baseline+(difficulty==='easy'?0:difficulty==='normal'?12*Math.sin(t*Math.PI):24*Math.sin(t*3*Math.PI+routeWiggle));
   if(t>=1){routePhase=0;routeSide=routeTo;routeClock=0;helperDir=routeTo===0?-1:1}
 }
}
function finish(msg){running=false;cancelAnimationFrame(raf);if(score>best){best=score;try{localStorage.setItem('sortpop_stack_best',String(best))}catch(e){}}$('overlay').classList.remove('hidden');$('overlay').querySelector('h1').innerHTML='おつかれさま<br>パレード！';$('overlay').querySelector('p').innerHTML='<b>'+msg.replace(/<br>/g,' ')+'</b>　SCORE '+score+' / BEST '+best+'<br><span id=paradeCount>0</span> 匹、仕分け成功！<br><span id=paradeLine style="display:block;min-height:50px;font-size:27px;white-space:nowrap;overflow:hidden">♪</span><span id=paradeTypes></span>';$('play').textContent='もう一回 ▶';hud();let n=0;let total=successes.length;let freq={};successes.forEach(t=>freq[TYPES[t].id]=(freq[TYPES[t].id]||0)+1);const labels={heart:'♥',cloud:'☁',star:'★',circle:'●',bar:'▬',flower:'✿'};let typesText=Object.entries(freq).map(([k,v])=>(labels[k]||k)+' '+v).join('　');if(paradeTimer)clearInterval(paradeTimer);paradeTimer=setInterval(()=>{n=Math.min(total,n+Math.max(1,Math.ceil(total/55)));let c=$('paradeCount'),l=$('paradeLine'),t=$('paradeTypes');if(!c||!l){clearInterval(paradeTimer);paradeTimer=null;return;}c.textContent=n;l.textContent=successes.slice(Math.max(0,n-8),n).map(x=>labels[TYPES[x].id]||'●').join('　')||'♪';if(n>=total){if(t)t.textContent=typesText;clearInterval(paradeTimer);paradeTimer=null;}},65)}
function mistake(msg){lives--;combo=0;note(msg);if(lives<=0)finish('GAME<br>OVER')}
function shape(t,x,y,r,a=0){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=TYPES[t].color;ctx.strokeStyle='#000';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.beginPath();
if(t===0){ctx.moveTo(0,r*.82);ctx.bezierCurveTo(-r*1.4,-r*.05,-r*.95,-r*1.05,0,-r*.35);ctx.bezierCurveTo(r*.95,-r*1.05,r*1.4,-r*.05,0,r*.82)}
else if(t===1){ctx.moveTo(-r*.88,r*.5);ctx.bezierCurveTo(-r*1.2,-r*.15,-r*.6,-r*.55,-r*.3,-r*.3);ctx.bezierCurveTo(-r*.15,-r*1.2,r*.75,-r*.95,r*.7,-r*.25);ctx.bezierCurveTo(r*1.35,-r*.1,r*1.1,r*.65,r*.5,r*.6);ctx.lineTo(-r*.65,r*.6);ctx.closePath()}
else if(t===2||t===5){let n=t===2?5:7;for(let i=0;i<n*2;i++){let theta=-Math.PI/2+i*Math.PI/n;let rr=i%2?r*.52:r;let xx=Math.cos(theta)*rr,yy=Math.sin(theta)*rr;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.closePath()}
else if(t===3){ctx.arc(0,0,r,0,Math.PI*2)}
else{ctx.rect(-r*1.1,-r*.43,r*2.2,r*.86)}
ctx.fill();ctx.stroke();if(t===5){ctx.beginPath();ctx.fillStyle='#ffff00';ctx.arc(0,0,r*.28,0,Math.PI*2);ctx.fill();ctx.stroke()}ctx.restore()}
function shotFromAim(e){if(!active||!aim)return;let dx=e.clientX-aim.x,dy=e.clientY-aim.y,mag=Math.hypot(dx,dy);if(mag<18){aim=null;return}let side=dx<0?0:1,good=currentTypes().indexOf(active.type)===side,power=Math.min(1,mag/135);let b=bins()[side];let tx=Math.max(b.x+14,Math.min(b.x+b.width-14,active.x+dx*1.35));let target=helper(),hit=false,perfect=false;
shots.push({type:active.type,x:active.x,y:active.y,r:active.r,tx:tx,ty:rim()+18,progress:0,duration:.32+.19*(1-power),side,good,perfect,hit,angle:0});active=null;aim=null;spawnDelay=.15;hud()}
canvas.addEventListener('pointerdown',e=>{if(!running||!active)return;aim={x:e.clientX,y:e.clientY,id:e.pointerId};try{canvas.setPointerCapture(e.pointerId)}catch(err){}e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(aim&&aim.id===e.pointerId){aim.mx=e.clientX;aim.my=e.clientY;e.preventDefault()}});
canvas.addEventListener('pointerup',e=>{if(aim&&aim.id===e.pointerId){shotFromAim(e);e.preventDefault()}});
canvas.addEventListener('pointercancel',()=>aim=null);
function settle(s){if(!s.good){mistake('WRONG!');return}const b=bins()[s.side];let x=Math.max(b.x+16,Math.min(b.x+b.width-16,s.hit?b.x+b.width/2+(Math.random()-.5)*b.width*.35:s.tx));let r=s.r*.72;bits.push({id:nextId++,type:s.type,x:x,y:rim()+r+6,vx:(x-(b.x+b.width/2))*.13,vy:15,angle:(Math.random()-.5)*.4,spin:(Math.random()-.5)*2,r,side:s.side});combo++;correct++;successes.push(s.type);let pts=s.perfect?300:s.hit?200:100;score+=pts;if(!busy)fever=Math.min(100,fever+(s.hit?23:11));note(s.perfect?'SUPER POP +300':s.hit?'TARGET +200':'GOOD +100');if(correct%14===0){pair++;note('NEW PAIR!')}if(fever>=100&&!busy)feverStart()}
function physics(dt){let bounds=bins(),base=floor();for(const p of bits){let b=bounds[p.side];p.vy+=1250*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.angle+=p.spin*dt;p.vx*=.988;p.spin*=.982;if(p.x-p.r<b.x){p.x=b.x+p.r;p.vx=Math.abs(p.vx)*.22;p.spin*=.8}if(p.x+p.r>b.x+b.width){p.x=b.x+b.width-p.r;p.vx=-Math.abs(p.vx)*.22;p.spin*=.8}if(p.y+p.r>base){p.y=base-p.r;p.vy=-Math.abs(p.vy)*.08;p.vx*=.85;p.spin*=.83}}
for(let iteration=0;iteration<4;iteration++){for(let i=0;i<bits.length;i++)for(let j=i+1;j<bits.length;j++){let a=bits[i],b=bits[j];if(a.side!==b.side)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,limit=a.r+b.r;if(d>=limit)continue;let nx=dx/d,ny=dy/d,over=limit-d;let ay=a.y+a.r>=base-1,by=b.y+b.r>=base-1;let share=ay?.1:by?.9:.5;a.x-=nx*over*share;b.x+=nx*over*(1-share);a.y-=ny*over*share;b.y+=ny*over*(1-share);let rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){let impulse=-rel*.45;a.vx-=impulse*nx;b.vx+=impulse*nx;a.vy-=impulse*ny;b.vy+=impulse*ny}a.spin-=nx*.07;b.spin+=nx*.07}
for(const p of bits){let bb=bounds[p.side];p.x=Math.max(bb.x+p.r,Math.min(bb.x+bb.width-p.r,p.x));p.y=Math.min(base-p.r,p.y)}}
if(bits.some(p=>p.y-p.r<rim()+6&&!feverIds.has(p.id))){if(mode==='endless')finish('STACK<br>OVER!');else {bits=[];mistake('TOO HIGH!')}}}
function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);let b=bins();ctx.lineWidth=4;for(let i=0;i<2;i++){let v=b[i];ctx.fillStyle=i===0?'#ffe0f0':'#e0ffff';ctx.fillRect(v.x,rim(),v.width,floor()-rim());ctx.strokeStyle=i===0?'#ff0080':'#0000ff';ctx.beginPath();ctx.moveTo(v.x,rim());ctx.lineTo(v.x,floor());ctx.lineTo(v.x+v.width,floor());ctx.lineTo(v.x+v.width,rim());ctx.stroke();ctx.setLineDash([5,5]);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(v.x+v.width/2,rim()+7);ctx.lineTo(v.x+v.width/2,rim()+33);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#000';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(i===0?'← LEFT':'RIGHT →',v.x+v.width/2,rim()+48)}
ctx.setLineDash([7,8]);ctx.strokeStyle='#888';ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,rim());ctx.stroke();ctx.setLineDash([]);
// The helper stays upright and carries the target on the inside-facing arm.
const helperNow=helper();ctx.save();ctx.translate(helperNow.x,helperNow.y);const ko=carrier==='koala',toward=helperNow.x<w/2?1:-1;
ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.fillStyle=ko?'#808080':'#ffcc99';
ctx.beginPath();ctx.arc(0,-18,13,0,Math.PI*2);ctx.fill();ctx.stroke();
if(!ko){ctx.fillStyle='#000';ctx.fillRect(-13,-30,26,7)}else{ctx.beginPath();ctx.arc(-10,-29,7,0,7);ctx.arc(10,-29,7,0,7);ctx.fillStyle='#808080';ctx.fill();ctx.stroke()}
ctx.fillStyle=ko?'#ff0000':'#00aa00';ctx.fillRect(-15,-3,30,28);ctx.strokeRect(-15,-3,30,28);
ctx.beginPath();ctx.moveTo(-7,25);ctx.lineTo(-8,40);ctx.moveTo(7,25);ctx.lineTo(8,40);ctx.stroke();
ctx.beginPath();ctx.moveTo(toward*12,4);ctx.lineTo(toward*22,-5);ctx.stroke();
const targetX=toward*27,targetY=-10;
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(targetX,targetY,helperNow.r,0,Math.PI*2);ctx.fill();ctx.stroke();
ctx.fillStyle='#ff0000';ctx.beginPath();ctx.arc(targetX,targetY,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(targetX,targetY,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff0000';ctx.beginPath();ctx.arc(targetX,targetY,3,0,Math.PI*2);ctx.fill();ctx.restore();
for(const p of bits)shape(p.type,p.x,p.y,p.r,p.angle);
for(const s of shots){let t=s.progress;let x=s.x+(s.tx-s.x)*t,y=s.y+(s.ty-s.y)*t-48*Math.sin(t*Math.PI);shape(s.type,x,y,s.r*.9,t*2)}
if(active){shape(active.type,active.x,active.y,active.r*1.35,elapsed*.5);ctx.fillStyle='#000';ctx.textAlign='center';ctx.font='bold 12px sans-serif';ctx.fillText('SWIPE ← →',active.x,active.y-31)}
if(aim&&active){let r=canvas.getBoundingClientRect(),dx=(aim.mx??aim.x)-aim.x,dy=(aim.my??aim.y)-aim.y;ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(active.x,active.y);ctx.lineTo(active.x+dx*.9,active.y+dy*.9);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff0080';ctx.beginPath();ctx.arc(active.x+dx*.9,active.y+dy*.9,6,0,7);ctx.fill()}
if(busy){ctx.fillStyle='#ffff00';ctx.fillRect(8,Math.max(12,rim()-42),w-16,31);ctx.strokeStyle='#000';ctx.strokeRect(8,Math.max(12,rim()-42),w-16,31);ctx.fillStyle='#000';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText('FEVER! おかたづけ中',w/2,Math.max(36,rim()-19))}}
function loop(now){if(!running)return;let dt=Math.min(.032,(now-last)/1000||0);last=now;elapsed+=dt;if(mode==='quick'){time-=dt;if(time<=0){finish('TIME<br>UP!');return}}if(noticeTimer>0){noticeTimer-=dt;if(noticeTimer<=0)noteReset()}
// Staff moves across both bins continuously, including during cleanup.
moveHelper(dt)
if(busy){busy-=dt;if(busy<=0)feverFinish()}

for(let i=shots.length-1;i>=0;i--){let sh=shots[i];sh.progress+=dt/sh.duration;
