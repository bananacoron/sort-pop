<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffdb69"><title>SORT! POP — スワイプ仕分け</title><style>
:root{--ink:#302a40;--cream:#fff9e9;--yellow:#ffda69;--pink:#ff82b3;--blue:#75d6e9;--mint:#9be5b5;--shadow:5px 6px 0 var(--ink)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{font-family:ui-rounded,"Hiragino Maru Gothic ProN","Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);background:var(--yellow);touch-action:none}button{font:inherit;cursor:pointer;color:inherit}#app{height:100dvh;max-width:560px;margin:auto;position:relative;overflow:hidden;background:var(--cream);border-inline:3px solid var(--ink)}.confetti{position:absolute;inset:0;pointer-events:none;opacity:.12;background-image:radial-gradient(#fa81a8 2px,transparent 3px),radial-gradient(#64c9d9 2px,transparent 3px);background-size:45px 47px,69px 62px;background-position:4px 10px,27px 35px}.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;z-index:2}.screen.active{display:flex}.pill{border:3px solid var(--ink);border-radius:999px;background:white;padding:8px 15px;font-size:12px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}.start{justify-content:center;gap:19px;padding:24px;text-align:center}.eyebrow{font-weight:900;letter-spacing:3px;font-size:13px}.logo{font-weight:1000;font-size:clamp(60px,17vw,92px);letter-spacing:-7px;line-height:.95;transform:rotate(-5deg);text-shadow:5px 6px 0 #f7a6c1,-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink)}.logo span{color:#ff7ca9}.logo small{display:block;font-size:23px;letter-spacing:5px;text-shadow:none;transform:rotate(5deg);margin-top:14px}.hero{display:flex;gap:12px;align-items:center;justify-content:center;margin:8px 0}.hero .mini{width:95px;height:112px;border:3px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);display:grid;place-items:center;background:white;transform:rotate(-8deg)}.hero .mini:nth-child(2){transform:rotate(8deg);background:#e6f8ed}.hero svg{width:75px;height:75px}.description{font-size:14px;line-height:1.9;font-weight:750}.bigbtn{background:var(--pink);border:3px solid var(--ink);border-radius:18px;box-shadow:var(--shadow);padding:16px 38px;font-size:22px;font-weight:1000;min-width:205px;transition:transform .1s,box-shadow .1s}.bigbtn:active{transform:translate(4px,4px);box-shadow:1px 2px 0 var(--ink)}.tiny{font-size:12px;color:#625d6a;font-weight:700}.hud{width:100%;padding:calc(env(safe-area-inset-top) + 16px) 17px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}.stat{display:flex;flex-direction:column;align-items:center;gap:1px}.stat label{font-size:10px;font-weight:900;letter-spacing:1.2px}.stat strong{font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}.timer{background:var(--yellow);border:3px solid var(--ink);padding:7px 16px;border-radius:15px;box-shadow:3px 3px 0 var(--ink);font-size:27px;font-weight:1000;font-variant-numeric:tabular-nums}.progress{height:9px;width:calc(100% - 34px);background:#e5e1dc;border:2px solid var(--ink);border-radius:9px;overflow:hidden}.progress>div{height:100%;width:100%;background:var(--pink);transform-origin:left}.targets{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 15px 8px}.target{border:3px solid var(--ink);border-radius:18px;padding:9px 6px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:3px 4px 0 var(--ink);font-weight:1000;font-size:14px}.target.left{background:var(--pink)}.target.right{background:var(--blue)}.target svg{height:37px;width:37px}.arena{position:relative;flex:1;width:100%;min-height:0;touch-action:none;overflow:hidden}.centerline{position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed #e4d9d3;opacity:.7}.lane{position:absolute;bottom:15%;font-size:13px;font-weight:1000;opacity:.5;letter-spacing:1px}.lane.l{left:9%}.lane.r{right:9%}.item{position:absolute;left:50%;top:0;width:min(37vw,160px);height:min(41vw,175px);max-height:170px;background:#fff;border:4px solid var(--ink);border-radius:25px;box-shadow:6px 7px 0 var(--ink);display:grid;place-items:center;transform:translate(-50%,0);will-change:transform;user-select:none;touch-action:none;cursor:grab}.item svg{width:78%;height:78%}.item:active{cursor:grabbing}.item::after{content:'SWIPE!';position:absolute;bottom:9px;font-size:10px;letter-spacing:2px;font-weight:1000;color:#777}.bottom{padding:7px 18px calc(env(safe-area-inset-bottom) + 15px);display:flex;align-items:center;justify-content:space-between;width:100%;font-weight:900;font-size:14px}.hearts{font-size:22px;letter-spacing:2px;color:#ff6d9b;-webkit-text-stroke:1px var(--ink)}.combo{border-radius:100px;background:#e7d5ff;padding:8px 12px;border:2px solid var(--ink);font-size:14px}.floatmsg{position:absolute;left:50%;top:32%;transform:translateX(-50%);font-size:28px;font-weight:1000;pointer-events:none;z-index:10;white-space:nowrap;text-shadow:2px 2px #fff;animation:float .55s ease-out forwards}@keyframes float{to{transform:translate(-50%,-65px);opacity:0}}.end{justify-content:center;gap:18px;padding:24px;text-align:center}.end h2{font-size:40px;margin:0;line-height:1.15}.end .result{font-size:62px;font-weight:1000;letter-spacing:-3px}.end .new{color:#d34c86;font-weight:1000}.instructions{background:white;border:3px solid var(--ink);box-shadow:var(--shadow);border-radius:19px;padding:12px 16px;font-size:13px;line-height:1.9;font-weight:800;max-width:360px}.mute{position:absolute;right:13px;top:calc(env(safe-area-inset-top) + 11px);z-index:5;background:#fff;border:2px solid var(--ink);border-radius:99px;width:34px;height:34px;font-size:17px}.play .hud{padding-right:57px}@media(max-height:690px){.start{gap:11px}.hero .mini{height:88px;width:85px}.hero svg{width:65px}.logo{font-size:62px}.description{font-size:12px}.hud{padding-top:calc(env(safe-area-inset-top) + 7px)}.targets{padding-top:8px}.target svg{width:28px;height:28px}.item{width:min(33vw,130px);height:min(36vw,145px)}.end{gap:10px}}
</style></head><body><div id="app"><div class="confetti"></div><button class="mute" id="mute" aria-label="効果音の切り替え">♪</button><section class="screen start active" id="start"><div class="pill">RETRO POP ARCADE</div><div class="logo">SORT<span>!</span><small>POP EDITION</small></div><div class="hero"><div class="mini" id="heroA"></div><div class="mini" id="heroB"></div></div><div class="description">ころころ落ちてくるアイテムを<br>左右にスワイプして仕分けよう！<br>60秒でどこまでスコアを伸ばせる？</div><button class="bigbtn" id="startBtn">LET'S PLAY ↗</button><div class="pill">🏆 BEST <span id="bestStart">0</span> PTS</div><div class="tiny">ミス・見逃しは3回まで / 何度でもリトライOK</div></section><section class="screen play" id="play"><div class="hud"><div class="stat"><label>SCORE</label><strong id="score">0</strong></div><div class="timer" id="timer">60</div><div class="stat"><label>BEST</label><strong id="bestPlay">0</strong></div></div><div class="progress"><div id="timebar"></div></div><div class="targets"><div class="target left"><span>←</span><span id="leftIcon"></span><span id="leftName"></span></div><div class="target right"><span id="rightName"></span><span id="rightIcon"></span><span>→</span></div></div><div class="arena" id="arena"><div class="centerline"></div><div class="lane l">← LEFT</div><div class="lane r">RIGHT →</div></div><div class="bottom"><div>CHANCES <span class="hearts" id="hearts">♥♥♥</span></div><div class="combo" id="combo">COMBO ×0</div></div></section><section class="screen end" id="end"><div class="pill" id="endTag">TIME UP!</div><h2>GOOD<br>GAME!</h2><div class="tiny">YOUR SCORE</div><div class="result" id="endScore">0</div><div class="new" id="newRecord"></div><div class="instructions">🏆 BEST <span id="bestEnd">0</span> PTS<br>✨ MAX COMBO <span id="maxCombo">0</span><br>🎯 正解 <span id="correctCount">0</span> 回</div><button class="bigbtn" id="retryBtn">ONE MORE! ↗</button><button id="homeBtn" style="background:none;border:none;text-decoration:underline;font-weight:900;padding:8px">タイトルにもどる</button></section></div><script>
'use strict';
const $=id=>document.getElementById(id);
const STROKE='#302a40';
function icon(type){let inside='';switch(type){
case 'cherry':inside=`<path d="M49 45Q42 24 55 13M49 45Q65 24 75 28M55 13Q65 10 73 15" fill="none" stroke="#347e61" stroke-width="6" stroke-linecap="round"/><path d="M55 15Q34 6 28 21Q43 29 55 15" fill="#79ca8f" stroke="${STROKE}" stroke-width="3"/><circle cx="37" cy="66" r="18" fill="#f26c87" stroke="${STROKE}" stroke-width="4"/><circle cx="70" cy="65" r="18" fill="#f26c87" stroke="${STROKE}" stroke-width="4"/><path d="M31 60l6 -5M65 59l6 -5" stroke="white" stroke-width="5" stroke-linecap="round"/>`;break;
case 'star':inside=`<path d="M50 8L61 36L91 39L68 58L75 88L50 72L25 88L32 58L9 39L39 36Z" fill="#ffd56a" stroke="${STROKE}" stroke-width="4" stroke-linejoin="round"/><path d="M35 48l5 -5M60 45l5 -5" stroke="white" stroke-width="5" stroke-linecap="round"/>`;break;
case 'flower':inside=Array.from({length:6},(_,i)=>`<ellipse cx="50" cy="31" rx="13" ry="21" fill="#ffa2c3" stroke="${STROKE}" stroke-width="3" transform="rotate(${i*60} 50 50)"/>`).join('')+`<circle cx="50" cy="50" r="13" fill="#ffdb69" stroke="${STROKE}" stroke-width="3"/>`;break;
case 'lemon':inside=`<path d="M22 57Q17 35 37 23Q58 8 77 29Q91 51 70 72Q46 91 27 73Z" fill="#ffdc65" stroke="${STROKE}" stroke-width="4"/><path d="M52 23Q55 9 72 13Q70 28 52 23" fill="#9ddd9b" stroke="${STROKE}" stroke-width="3"/><path d="M30 58Q31 68 41 71" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>`;break;
case 'heart':inside=`<path d="M50 87L15 53Q-2 34 17 20Q36 7 50 28Q64 7 83 20Q102 34 85 53Z" fill="#ff829f" stroke="${STROKE}" stroke-width="4"/><path d="M24 34Q28 28 35 30" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>`;break;
case 'cloud':inside=`<path d="M25 72Q9 72 9 57Q9 43 24 42Q26 20 48 20Q68 20 73 39Q91 39 91 56Q91 73 74 73Z" fill="#a8e3f3" stroke="${STROKE}" stroke-width="4"/><path d="M28 49Q31 41 39 39" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>`;break;
case 'moon':inside=`<path d="M66 12A39 39 0 1 0 86 75A33 33 0 0 1 66 12Z" fill="#c5aff6" stroke="${STROKE}" stroke-width="4"/><circle cx="33" cy="57" r="4" fill="white"/>`;break;
case 'leaf':inside=`<path d="M18 80Q10 28 83 17Q88 79 18 80Z" fill="#94d9a3" stroke="${STROKE}" stroke-width="4"/><path d="M20 78Q45 48 77 26" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>`;break;
}return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${type}">${inside}</svg>`}
const pairs=[{l:'cherry',r:'star',ln:'CHERRY',rn:'STAR'},{l:'flower',r:'lemon',ln:'FLOWER',rn:'LEMON'},{l:'heart',r:'cloud',ln:'HEART',rn:'CLOUD'},{l:'moon',r:'leaf',ln:'MOON',rn:'LEAF'}];
$('heroA').innerHTML=icon('cherry');$('heroB').innerHTML=icon('star');
let best=0;try{best=Number(localStorage.getItem('sortPopBest')||0)}catch(e){};
let screen='start',running=false,score=0,combo=0,maxCombo=0,correct=0,lives=3,timeLeft=60,elapsed=0,spawnClock=0,active=null,raf=0,lastFrame=0,pair=pairs[0],pairIndex=0,roundCount=0,sound=true,audioCtx=null;
const screenIds=['start','play','end'];function show(name){screen=name;screenIds.forEach(id=>$(id).classList.toggle('active',id===name));$('mute').style.display=name==='play'?'block':'none'}
function updateBest(){$('bestStart').textContent=best.toLocaleString();$('bestPlay').textContent=best.toLocaleString();$('bestEnd').textContent=best.toLocaleString()}
function beep(ok=true){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;osc.type='sine';osc.frequency.setValueAtTime(ok?500:210,now);osc.frequency.exponentialRampToValueAtTime(ok?760:120,now+.11);gain.gain.setValueAtTime(.065,now);gain.gain.exponentialRampToValueAtTime(.001,now+.14);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.15)}catch(e){}}
$('mute').addEventListener('click',()=>{sound=!sound;$('mute').textContent=sound?'♪':'×'});
function setPair(){pair=pairs[pairIndex%pairs.length];$('leftIcon').innerHTML=icon(pair.l);$('rightIcon').innerHTML=icon(pair.r);$('leftName').textContent=pair.ln;$('rightName').textContent=pair.rn}
function updateHUD(){$('score').textContent=score.toLocaleString();$('combo').textContent=`COMBO ×${combo}`;$('hearts').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);$('timer').textContent=Math.ceil(timeLeft);$('timebar').style.transform=`scaleX(${Math.max(0,timeLeft)/60})`}
function clearActive(){if(active){active.el.remove();active=null}}
function startGame(){cancelAnimationFrame(raf);clearActive();score=0;combo=0;maxCombo=0;correct=0;lives=3;timeLeft=60;elapsed=0;spawnClock=0;pairIndex=0;roundCount=0;setPair();updateBest();updateHUD();show('play');running=true;lastFrame=performance.now();raf=requestAnimationFrame(tick)}
function spawn(){if(!running||active)return;let kind=Math.random()<.5?pair.l:pair.r;const el=document.createElement('div');el.className='item';el.innerHTML=icon(kind);$('arena').appendChild(el);active={el,kind,y:-190,x:0,dragX:0,dragY:0,pointerId:null,startX:0,startY:0,down:false};el.addEventListener('pointerdown',pointerDown);el.addEventListener('pointermove',pointerMove);el.addEventListener('pointerup',pointerUp);el.addEventListener('pointercancel',pointerCancel);renderItem()}
function renderItem(){if(!active)return;active.el.style.transform=`translate(calc(-50% + ${active.dragX}px),${active.y+active.dragY}px) rotate(${active.dragX/17}deg)`}
function pointerDown(e){if(!running||!active||active.down)return;active.down=true;active.pointerId=e.pointerId;active.startX=e.clientX;active.startY=e.clientY;active.el.setPointerCapture(e.pointerId);e.preventDefault()}
function pointerMove(e){if(!active||!active.down||active.pointerId!==e.pointerId)return;active.dragX=e.clientX-active.startX;active.dragY=Math.max(-40,Math.min(65,e.clientY-active.startY));renderItem();e.preventDefault()}
function pointerUp(e){if(!active||active.pointerId!==e.pointerId)return;const dx=e.clientX-active.startX;active.down=false;if(Math.abs(dx)>55){sort(dx<0?'left':'right')}else{active.dragX=0;active.dragY=0;renderItem()}e.preventDefault()}
function pointerCancel(e){if(active&&active.pointerId===e.pointerId){active.down=false;active.dragX=0;active.dragY=0;renderItem()}}
function popup(txt,ok){const el=document.createElement('div');el.className='floatmsg';el.style.color=ok?'#d35a89':'#6b55b5';el.textContent=txt;$('arena').appendChild(el);setTimeout(()=>el.remove(),570)}
function sort(side){if(!running||!active)return;const correctSide=active.kind===pair.l?'left':'right';const el=active.el;const dx=side==='left'?-innerWidth:innerWidth;el.style.transition='transform .2s ease-out,opacity .2s';el.style.transform=`translate(calc(-50% + ${dx}px),${active.y}px) rotate(${side==='left'?-35:35}deg)`;el.style.opacity='0';active=null;setTimeout(()=>el.remove(),220);if(side===correctSide){combo++;correct++;maxCombo=Math.max(maxCombo,combo);const points=100+Math.min(500,Math.floor((combo-1)/5)*50);score+=points;popup(combo%5===0?`NICE! ×${combo}`:`+${points}`,true);beep(true);roundCount++;if(roundCount%12===0){pairIndex++;setPair();popup('NEW PAIR!',true)}}else{loseLife('OOPS!')}spawnClock=0;updateHUD()}
function loseLife(msg){lives--;combo=0;popup(msg,false);beep(false);if(lives<=0)finish('GAME OVER')}
function tick(now){if(!running)return;const dt=Math.min((now-lastFrame)/1000,.05);lastFrame=now;timeLeft-=dt;elapsed+=dt;if(timeLeft<=0){timeLeft=0;updateHUD();finish('TIME UP!');return}const interval=Math.max(.25,.72-elapsed*.0035);if(!active){spawnClock+=dt;if(spawnClock>=interval){spawnClock=0;spawn()}}else if(!active.down){const arena=$('arena');const speed=Math.min(280+elapsed*3.1,470);active.y+=speed*dt;renderItem();if(active.y>arena.clientHeight+30){clearActive();loseLife('MISSED!');spawnClock=0}}updateHUD();if(running)raf=requestAnimationFrame(tick)}
function finish(tag){running=false;cancelAnimationFrame(raf);clearActive();$('endTag').textContent=tag;$('endScore').textContent=score.toLocaleString();$('maxCombo').textContent=maxCombo;$('correctCount').textContent=correct;let record=score>best;if(record){best=score;try{localStorage.setItem('sortPopBest',String(best))}catch(e){}}$('newRecord').textContent=record?'★ NEW RECORD! ★':'';updateBest();show('end')}
$('startBtn').addEventListener('click',startGame);$('retryBtn').addEventListener('click',startGame);$('homeBtn').addEventListener('click',()=>{running=false;cancelAnimationFrame(raf);clearActive();updateBest();show('start')});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){lastFrame=performance.now()}});updateBest();show('start');
</script></body></html>
