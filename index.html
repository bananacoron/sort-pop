<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>SORT! POP — シンプル仕分け版</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;touch-action:none}body{font-family:system-ui,sans-serif;color:#111;background:#f4f4f4}#app{margin:auto;max-width:520px;height:100dvh;display:flex;flex-direction:column;background:white;border-inline:3px solid #111}
header{padding:calc(env(safe-area-inset-top) + 7px) 10px 7px;border-bottom:3px solid #111;display:flex;align-items:center;justify-content:space-between;text-align:center}header b{font-size:22px}header small{font-size:10px;font-weight:800}#life{color:#e41449}#targets{display:flex;gap:8px;padding:8px}#targets>div{flex:1;text-align:center;border:3px solid #111;border-radius:8px;padding:5px;font-size:17px;font-weight:900}#targets span{font-size:25px}#targets>div:first-child{background:#ffb9d9}#targets>div:last-child{background:#b6f4ff}#stage{flex:1;min-height:140px;position:relative;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}footer{border-top:3px solid #111;display:flex;justify-content:space-between;align-items:center;padding:7px 9px calc(env(safe-area-inset-bottom) + 7px);font-weight:800;font-size:12px;gap:6px}button{border:3px solid #111;background:#ffea4d;border-radius:8px;padding:9px 12px;font-weight:900;color:#111}#overlay{position:absolute;inset:0;z-index:4;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:14px;padding:20px}#overlay.hidden{display:none}#overlay h1{font-size:clamp(46px,14vw,68px);line-height:1;margin:0;letter-spacing:-4px}#overlay p{font-weight:800;font-size:14px;line-height:1.8;margin:0}#overlay .result{font-size:20px;font-weight:900;line-height:1.8}.tiny{font-size:11px;color:#555}#hint{font-weight:900;font-size:12px}#crew{display:flex;align-items:center;gap:6px;font-size:11px}#crew svg{height:30px;width:30px}#toast{position:absolute;top:30%;left:0;right:0;text-align:center;font-weight:1000;font-size:24px;color:#e41449;pointer-events:none;text-shadow:2px 2px white;opacity:0}#toast.show{animation:pop .6s steps(4,end)}@keyframes pop{0%{opacity:1;transform:scale(.7)}40%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1)}} 
</style></head><body><main id="app"><header><div><small>SCORE</small><br><b id="score">0</b></div><div><small>のこり</small><br><b id="timer">60</b><small> 秒</small></div><div><small>LIFE</small><br><b id="life">♥ ♥ ♥</b></div></header><div id="targets"><div>← <span style="color:#ff0080">♥</span> ハート</div><div>もくもく <span style="color:#00bfff">☁</span> →</div></div><section id="stage"><canvas id="game"></canvas><div id="toast"></div><div id="overlay"><div class="tiny">SORT! POP · シンプル試作 Ver. S2</div><h1>SORT<span style="color:#ff0080">!</span><br>POP</h1><p>落ちてくる子を左右にスワイプ！<br>♥は左、☁は右のカゴへ。<br>カゴがいっぱいになったら自動で回収！<br>間違える・見逃すと ♥−1</p><button id="play">あそぶ！ ▶</button><div class="tiny">60秒 / 落下位置・速度が変化 / 的当てなし</div></div></section><footer><div id="crew"></div><span id="hint">左右にスワイプ！</span><button id="sound">🔊</button><button id="pause">⏸</button></footer></main>
<script>
"use strict";
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),stage=$('stage');
const TYPES=[{id:'heart',color:'#ff0080',r:19},{id:'cloud',color:'#00bfff',r:24}];
function shape(t,x,y,r,a=0){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=TYPES[t].color;ctx.strokeStyle='#000';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.beginPath();
if(t===0){ctx.moveTo(0,r*.82);ctx.bezierCurveTo(-r*1.4,-r*.05,-r*.95,-r*1.05,0,-r*.35);ctx.bezierCurveTo(r*.95,-r*1.05,r*1.4,-r*.05,0,r*.82)}
else if(t===1){ctx.moveTo(-r*.88,r*.5);ctx.bezierCurveTo(-r*1.2,-r*.15,-r*.6,-r*.55,-r*.3,-r*.3);ctx.bezierCurveTo(-r*.15,-r*1.2,r*.75,-r*.95,r*.7,-r*.25);ctx.bezierCurveTo(r*1.35,-r*.1,r*1.1,r*.65,r*.5,r*.6);ctx.lineTo(-r*.65,r*.6);ctx.closePath()}
else if(t===2||t===5){let n=t===2?5:7;for(let i=0;i<n*2;i++){let theta=-Math.PI/2+i*Math.PI/n;let rr=i%2?r*.52:r;let xx=Math.cos(theta)*rr,yy=Math.sin(theta)*rr;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.closePath()}
else if(t===3){ctx.arc(0,0,r,0,Math.PI*2)}
else{ctx.rect(-r*1.1,-r*.43,r*2.2,r*.86)}
ctx.fill();ctx.stroke();if(t===5){ctx.beginPath();ctx.fillStyle='#ffff00';ctx.arc(0,0,r*.28,0,Math.PI*2);ctx.fill();ctx.stroke()}ctx.restore()}
function staffSvg(k){let ko=k==='koala';return `<svg viewBox="0 0 64 64"><path d="M5 62L9 38L23 32H42L55 40L61 62Z" fill="${ko?'#ff0000':'#00aa00'}" stroke="#000" stroke-width="3"/><path d="${ko?'M7 18Q-2 2 17 6Q33 -3 47 6Q65 1 58 21Q65 44 35 45Q5 47 7 18Z':'M12 20L9 7L23 2L48 4L57 14L51 29L50 43L14 43Z'}" fill="${ko?'#808080':'#ffcc99'}" stroke="#000" stroke-width="3"/><path d="${ko?'M30 22Q23 35 32 37Q41 35 34 22Z':'M10 17L12 4L28 1L50 3L58 17L44 13L25 15Z'}" fill="${ko?'#404040':'#000000'}"/><circle cx="21" cy="24" r="2.5"/><circle cx="43" cy="24" r="2.5"/><path d="M25 37Q33 43 42 36" stroke="#000" stroke-width="2" fill="none"/></svg>`}

let w=320,h=500,running=false,paused=false,score=0,life=3,time=60,correct=0,wrong=0,missed=0,collections=0,combo=0,active=null,items=[[],[]],stored=[],effects=[],next=.5,last=0,raf=0,pointer=null,worker=0,collection=[0,0],flash=[0,0],sound=true,ac=null;
const capacity=12;
let placements=[[],[]], pending=[false,false], collector=null, difficulty=1;
function resize(){let r=canvas.getBoundingClientRect();w=r.width;h=r.height;let d=devicePixelRatio||1;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();
function audio(f=540){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.11)}catch(e){}}
function toast(s){let el=$('toast');el.textContent=s;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function hud(){$('score').textContent=score;$('timer').textContent=Math.ceil(Math.max(0,time));$('life').textContent='♥ '.repeat(life)+'♡ '.repeat(3-life);if($('crew').dataset.worker!==String(worker%2)){$('crew').dataset.worker=String(worker%2);$('crew').innerHTML=staffSvg(worker%2?'brother':'koala')+'<span>いっぱいになったら迎えに行くよ！</span>'}}
function start(){cancelAnimationFrame(raf);running=true;paused=false;score=0;life=3;time=60;correct=0;wrong=0;missed=0;collections=0;combo=0;active=null;items=[[],[]];stored=[];effects=[];next=.3;worker=0;collection=[0,0];flash=[0,0];placements=[[],[]];pending=[false,false];collector=null;difficulty=1;pointer=null;$('overlay').classList.add('hidden');$('pause').textContent='⏸';hud();last=performance.now();raf=requestAnimationFrame(loop)}
function end(){running=false;cancelAnimationFrame(raf);$('overlay').classList.remove('hidden');$('overlay').innerHTML=`<div class="tiny">SORT! POP · シンプル試作 Ver. S2</div><h1>おつかれ！<br>🎉</h1><div class="result">SCORE ${score}<br>正解 ${correct}回<br>仕分けミス ${wrong}回<br>見逃し ${missed}回<br>カゴ回収 ${collections}回</div><p>集めた子たち：${'♥'.repeat(Math.min(12,stored.filter(x=>x===0).length))}${'☁'.repeat(Math.min(12,stored.filter(x=>x===1).length))}</p><button id="play">もう一回 ▶</button>`;$('play').onclick=start}
function lose(reason){life--;combo=0;toast(reason+' ♥−1');audio(220);hud();if(life<=0)end()}
function swipe(side){if(!active||!running||paused)return;let a=active;active=null;if(a.type!==side){wrong++;lose('仕分けミス');return}correct++;combo++;score+=100+(Math.min(10,combo)-1)*10;items[side].push(a.type);
 let stack=placements[side], radius=17+Math.random()*7, xx=(Math.random()-.5)*.72, yy=0;
 for(let j=0;j<30;j++){let candidate=0;for(let q of stack){let dx=(xx-q.x)*w*.19, dist=(radius+q.r)*.91;if(Math.abs(dx)<dist){candidate=Math.max(candidate,q.y+Math.sqrt(Math.max(0,dist*dist-dx*dx)))}}yy=candidate;if(yy<h*.29-25)break;xx=(Math.random()-.5)*.72}
 stack.push({x:xx,y:yy,r:radius,rot:(Math.random()-.5)*.7,bounce:1});audio(640+Math.min(combo,8)*40);if(items[side].length>=capacity&&!pending[side]){pending[side]=true;if(!collector)beginCollection(side)}hud()}
function beginCollection(side){collector={side,phase:0,t:0};}
function updateCollector(dt){if(!collector)return;let c=collector;c.t+=dt;if(c.phase===0&&c.t>.75){c.phase=1;c.t=0;stored.push(...items[c.side]);items[c.side]=[];placements[c.side]=[];collections++;score+=200;audio(880);hud()}
 else if(c.phase===1&&c.t>.65){pending[c.side]=false;collector=null;worker++;let other=pending.findIndex(Boolean);if(other>=0)beginCollection(other)}}
function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(!running)return;if(!paused){time-=dt;next-=dt;difficulty=1+Math.floor(correct/8);updateCollector(dt);for(let stack of placements)for(let q of stack)q.bounce=Math.max(0,q.bounce-dt*3);flash=flash.map(x=>Math.max(0,x-dt));collection=collection.map(x=>Math.max(0,x-dt));if(!active&&next<=0){active={type:Math.random()<.5?0:1,y:35,x:w*(.22+Math.random()*.56),r:18+Math.random()*10,wobble:Math.random()*6.28};next=.2}if(active){active.y+=(95+Math.min(110,difficulty*13))*dt;active.x+=Math.sin(now/370+active.wobble)*dt*(difficulty>=3?28:9);active.x=Math.max(28,Math.min(w-28,active.x));if(active.y>h*.62){active=null;missed++;lose('見逃し');next=.14}}if(time<=0){end();return}hud()}draw();raf=requestAnimationFrame(loop)}
function basket(side){let left=side===0,center=left?w*.25:w*.75,base=h-14,top=h*.63,wide=Math.min(w*.42,160);ctx.save();if(pending[side]&&collector&&collector.side===side&&collector.phase===0)ctx.translate(Math.sin(performance.now()/45)*2,0);ctx.fillStyle='#d99a60';ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(center-wide/2,top);ctx.lineTo(center+wide/2,top);ctx.lineTo(center+wide*.43,base);ctx.lineTo(center-wide*.43,base);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#91572e';ctx.lineWidth=2;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(center+i*wide/6,top+4);ctx.lineTo(center+i*wide/7,base-4);ctx.stroke()}for(let j=1;j<=3;j++){let y=top+(base-top)*j/4;ctx.beginPath();ctx.moveTo(center-wide*.45,y);ctx.lineTo(center+wide*.45,y);ctx.stroke()}let n=placements[side].length;ctx.save();ctx.beginPath();ctx.moveTo(center-wide/2+4,top+3);ctx.lineTo(center+wide/2-4,top+3);ctx.lineTo(center+wide*.42-4,base-3);ctx.lineTo(center-wide*.42+4,base-3);ctx.closePath();ctx.clip();for(let i=0;i<n;i++){let q=placements[side][i],x=center+q.x*wide*.45,y=base-23-q.y-q.bounce*11;shape(side,x,y,q.r,q.rot)}ctx.restore();ctx.strokeStyle='#111';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(center-wide/2-3,top);ctx.lineTo(center+wide/2+3,top);ctx.stroke();if(pending[side]){ctx.font='900 16px system-ui';ctx.fillStyle='#e41449';ctx.textAlign='center';ctx.fillText('いっぱい！',center,top-13)}ctx.restore()}
function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#ddd';ctx.setLineDash([6,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w/2,h*.62);ctx.lineTo(w/2,h);ctx.stroke();ctx.setLineDash([]);basket(0);basket(1);if(collector){let c=collector,center=(c.side===0?w*.25:w*.75),from=w*.5,to=center,x=c.phase===0?from+(to-from)*Math.min(1,c.t/.75):to+(w*.5-to)*Math.min(1,c.t/.65),y=h*.61;ctx.save();ctx.translate(x,y);ctx.fillStyle=worker%2?'#00aa00':'#e33';ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-16,14,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillRect(-12,0,24,25);ctx.strokeRect(-12,0,24,25);ctx.beginPath();ctx.moveTo(-6,25);ctx.lineTo(-9,35);ctx.moveTo(6,25);ctx.lineTo(9,35);ctx.stroke();ctx.restore()}if(active){shape(active.type,active.x,active.y,active.r);ctx.fillStyle='#111';ctx.textAlign='center';ctx.font='800 12px system-ui';ctx.fillText('← SWIPE →',w/2,active.y-36)}if(pointer&&active){ctx.strokeStyle='#ff0080';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(pointer.x,pointer.y);ctx.lineTo(pointer.mx,pointer.my);ctx.stroke()}}
canvas.addEventListener('pointerdown',e=>{if(!running||paused||!active)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY,mx:e.clientX,my:e.clientY};try{canvas.setPointerCapture(e.pointerId)}catch{}e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(pointer&&pointer.id===e.pointerId){pointer.mx=e.clientX;pointer.my=e.clientY;e.preventDefault()}});
canvas.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;let dx=e.clientX-pointer.x;pointer=null;if(Math.abs(dx)>22)swipe(dx<0?0:1);e.preventDefault()});
canvas.addEventListener('pointercancel',()=>pointer=null);
$('play').onclick=start;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇'};$('pause').onclick=()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'▶':'⏸';$('hint').textContent=paused?'一時停止中':'左右にスワイプ！'};
</script></body></html>
